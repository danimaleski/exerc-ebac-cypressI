name: EBAC CI

on:
  push:
    branches: [ ci ]
    
  workflow_dispatch:

jobs:
  test:
    name: deploy to staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
    
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: install dependencies
        run: npm install
        
      - name: Cypress run
        uses: cypress-io/github-action@v2
        continue-on-error: true
        with: 
          install-command: npm install
          browser: chrome
          command: npx cypress run --config-file=cypress.config.js

      - name: Ensure reports directory exists
        run: mkdir -p mochawesome-report

      - name: Verify reports exist
        run: |
          if [ ! -f ./mochawesome-report/mochawesome*.json ]; then
            echo "No mochawesome report files found!"
            exit 1
          fi

      - name: Merge reports
        run: npx mochawesome-merge mochawesome-report/mochawesome*.json > mochawesome-report/report.json



      - name: Publish Report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mochawesome-report
